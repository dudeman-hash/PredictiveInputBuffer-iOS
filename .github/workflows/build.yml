name: Build iOS Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS arm64 mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: iOS
          # Supply the SDK binding PCH to generated sources; without it, FMOD wrappers fail before mod compilation.
          configure-args: '-DCMAKE_CXX_FLAGS=-include\ Geode/Bindings.hpp'
          use-lto: false
          use-cpm-cache: false

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: cesar.input-buffer-ios-geode
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
